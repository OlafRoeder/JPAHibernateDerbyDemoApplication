plugins {
    id 'java'
    id 'application'

    // Configure platform-specific JavaFX modules and Lombok annotation processing.
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'io.freefair.lombok' version '9.8.0'
}

group = 'de.olaf-roeder'
version = '0.1-DEVELOPER'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(27)
    }
}

repositories {
    mavenCentral()
}

lombok {
    version = '1.18.48'
}

dependencies {
    implementation 'org.slf4j:slf4j-api:2.0.20'
    implementation platform('org.apache.logging.log4j:log4j-bom:2.26.1')
    implementation 'org.apache.logging.log4j:log4j-api'
    runtimeOnly 'org.apache.logging.log4j:log4j-core'
    runtimeOnly 'org.apache.logging.log4j:log4j-slf4j2-impl'

    implementation 'jakarta.persistence:jakarta.persistence-api:3.2.0'
    implementation 'org.hibernate.orm:hibernate-core:7.4.13.Final'
    // Derby support is maintained in Hibernate's community dialects module.
    runtimeOnly 'org.hibernate.orm:hibernate-community-dialects:7.4.13.Final'
    // Jakarta Transactions requires Interceptors and CDI on the module path.
    runtimeOnly 'jakarta.interceptor:jakarta.interceptor-api:2.2.0'
    runtimeOnly 'jakarta.enterprise:jakarta.enterprise.cdi-api:5.0.0'
    runtimeOnly 'org.apache.derby:derby:10.17.1.0'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    // The module name must match module-info.java.
    mainModule = 'Hibernate.JPA.Derby.Demo.Application.main'
    mainClass = 'application.Main'
    // Resolve Hibernate's runtime modules as well as JavaFX's native libraries.
    applicationDefaultJvmArgs = ['--add-modules=ALL-MODULE-PATH', '--enable-native-access=javafx.graphics']
}

javafx {
    version = '27'
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.swing']
}

tasks.named('test') {
    useJUnitPlatform()
}
