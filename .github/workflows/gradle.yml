name: Java CI with Gradle

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK 27
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '27'
          distribution: 'temurin'
          cache: 'gradle'
          cache-dependency-path: |
            **/*.gradle
            gradle/wrapper/gradle-wrapper.properties

      # The JavaFX Gradle plugin supplies JavaFX 27 and its Linux native libraries.
      # Install GTK and a virtual display for JavaFX on the headless CI runner.
      - name: Install JavaFX runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-3-0t64 libasound2t64 xvfb xauth

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test with the Gradle wrapper
        run: xvfb-run --auto-servernum ./gradlew --no-daemon build
